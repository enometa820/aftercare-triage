# 쌍꺼풀(눈성형) 정상 회복궤적 KB
#
# ⚠️ 이것은 "일반 회복 정보"이며 임상 지침·진단·처방이 아니다.
#    성형·피부과의 공개 애프터케어 안내와 공개 의료정보를 종합한 참고용 자료로,
#    개인차가 크고 실제 판단은 시술한 의료진의 안내가 우선한다.
# ⚠️ 출처는 대부분 병원·클리닉의 공개 안내(2차 자료)다. 배포·운영 단계에서는
#    동료심사 문헌·공식 병원 질환백과(예: 서울아산병원 질환백과, ASPS)로 보강 권장.
# 용도: 판정 LLM에 "경과일 대비 정상 범위"를 주입 → 궤적을 벗어난 신호는
#       불확실/레드플래그로 기울이는 근거로만 사용(진단 아님).

procedure: 쌍꺼풀
disclaimer: 일반 공개 회복 정보 종합이며 임상 지침·진단·처방이 아니다. 개인차가 크므로 실제 판단은 시술한 의료진의 안내가 우선한다.

blocks:
  - id: 쌍꺼풀-0-2일
    day_range: [0, 2]
    label: 0-2일 (급성 부종기)
    normal_signs:
      - 수술 직후보다 24~48시간 사이에 붓기가 더 심해지는 것이 일반적(급성 부종 정점)
      - 눈 주위 멍이 둘째 날부터 나타나기 시작
      - 뻐근함·당김·경미한 통증·이물감
      - 절개부에서 소량의 맑거나 옅은 핏빛 삼출
    watch_signs:
      - 한쪽 눈만 급격히·비대칭적으로 부어오르며 심한 통증 동반
      - 고름 같은 노랗거나 탁한 분비물, 절개부가 벌어짐
      - 시야 흐림·복시 등 시력 변화
      - 38도 이상 발열
    source: 팝성형외과 매거진(pop-ps.com 쌍꺼풀 붓기 회복), 하이닥(news.hidoc.co.kr/news/articleView.html?idxno=33245)

  - id: 쌍꺼풀-3-7일
    day_range: [3, 7]
    label: 3-7일 (붓기 정점 후 감소·실밥 제거기)
    normal_signs:
      - 붓기가 정점을 지나 매일 눈에 띄게 감소
      - 멍 색이 보라·자주색에서 노랑·연두색으로 변함(체내 흡수 과정)
      - 절개식은 보통 5~7일에 실밥 제거, 비절개(매몰)식은 실밥 제거 불필요
      - 흉터·붓기 상태에 따라 실밥 제거를 며칠 늦출 수 있음
    watch_signs:
      - 붓기·통증이 줄지 않고 오히려 심해짐
      - 절개부 발적이 번지고 열감·고름을 동반
      - 실밥 부위 심한 진물·상처 벌어짐
    source: 팝성형외과 매거진(pop-ps.com), 허쉬성형외과(hershe9.co.kr 실밥 제거), aesthetx.com/blog/blepharoplasty-recovery-timeline

  - id: 쌍꺼풀-8-14일
    day_range: [8, 14]
    label: 8-14일 (약 2주, 붓기·멍 대부분 소실)
    normal_signs:
      - 멍과 붓기가 대부분 소실, 화장으로 잔여 변색 커버 가능한 수준
      - 아침에 약간의 부기가 남을 수 있음
      - 눈꺼풀이 점차 자연스러워지고 움직임 회복
    watch_signs:
      - 2주가 지나도 한쪽이 뚜렷하게 더 붓고 통증·발적이 지속
      - 새로 생긴 고름·진물
    source: nubodyconcepts.com(eyelid-surgery-recovery), aesthetx.com blepharoplasty recovery

  - id: 쌍꺼풀-15-30일
    day_range: [15, 30]
    label: 15-30일 (3-4주, 라인 안정화기)
    normal_signs:
      - 육안상 붓기·멍이 거의 소실되고 라인이 점차 안정
      - 흉터가 붉다가 서서히 옅어지기 시작
      - 미세한 부기가 남아 라인이 다소 두꺼워 보일 수 있음(정상 경과)
    watch_signs:
      - 갑작스러운 재발성 부종·통증·발적
      - 벌어지는 상처나 지속되는 분비물
    source: 팝성형외과 매거진(pop-ps.com), allskinsurgery.com eyelid recovery timeline

  - id: 쌍꺼풀-31-180일
    day_range: [31, 180]
    label: 1-6개월 (미세부종 소실·최종 형태)
    normal_signs:
      - 조직 내 미세부종이 3~6개월에 걸쳐 서서히 소실
      - 흉터가 성숙하며 옅어짐(3~6개월 지속)
      - 이 시기 이후 라인의 최종 형태 확인
    watch_signs:
      - 수개월째 한쪽만 지속·악화되는 부종·경결·통증
      - 흉터의 비정상적 비대(과증식성 흉터)
    source: 팝성형외과 매거진(pop-ps.com), drmmacdonald.com eyelid surgery timeline
