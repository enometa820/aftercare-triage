[project]
name = "sonar-care"
version = "0.1.0"
description = "Sonar Care — 성형·피부 시술 후 안전 트리아지 모듈 (측정된 안전: 못 믿을 때 사람에게 넘긴다)"
requires-python = ">=3.11"
# core = 실제로 import하는 것만 선언(정직 — 선언-미사용 0).
dependencies = [
    "anthropic>=0.40",            # 판정 LLM(claude-sonnet-5)
    "pydantic>=2.7",              # 3-way 구조화 출력 검증
    "numpy>=1.26",
    "matplotlib>=3.8",            # RC 곡선·ECE 시각화
    "pyyaml>=6.0",                # KB·레드플래그 사전
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# research = 프로덕션 승격 시 네이티브 구현의 대체 경로. 데모는 심플함 우선으로 직접 구현:
#   uqlm(black-box 불확실성) → gate.py self-consistency 네이티브 / mapie(컨포멀 CRC) → calibrate.py 네이티브
#   deepeval → test_triage.py plain pytest exact-match(BP: 이산 라벨은 결정론 채점 1순위) / promptfoo → npx(eval/promptfoo.yaml)
# 이 확장은 아직 코드가 import하지 않는다(선언만 하지 않기 위해 optional로 분리).
research = ["uqlm>=0.1", "mapie>=1.0", "langchain-anthropic>=0.2", "scikit-learn>=1.4", "deepeval>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonar_care", "src/sonar_scan"]

[tool.ruff]
line-length = 100
